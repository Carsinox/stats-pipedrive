<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stats commerciales · Pipedrive</title>
<style>
  :root{
    color-scheme:light dark;
    /* Marque VPA */
    --brand:#859CB6; --brand-2:#6C87A4; --brand-ink:#2A3B4E; --brand-soft:#EAEFF5;
    /* Surfaces & texte (clair) */
    --page:#EEF2F7; --surface:#FFFFFF; --surface-2:#F3F6FA;
    --text-primary:#1B2733; --text-secondary:#5C6B7A; --muted:#94A2B0;
    --grid:#E5EBF1; --baseline:#CBD5E0; --border:rgba(42,59,78,.10);
    /* Séries data */
    --s-ce:#3E6D9C; --s-r2:#E08A3C; --s-mandat:#2E9E6B;
    --good:#1F9D57; --good-ink:#157A43; --warn:#C77B18; --critical:#D9534F;
    --radius:16px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(42,59,78,.06),0 8px 24px rgba(42,59,78,.06);
    --shadow-lg:0 12px 40px rgba(42,59,78,.16);
  }
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
    --brand:#94ABC6; --brand-2:#7C97B5; --brand-ink:#0F1A26; --brand-soft:#1B2836;
    --page:#0E141B; --surface:#172230; --surface-2:#1E2C3B;
    --text-primary:#EAF1F8; --text-secondary:#A7B6C4; --muted:#6E7F90;
    --grid:#223141; --baseline:#324556; --border:rgba(255,255,255,.09);
    --s-ce:#6FA0CE; --s-r2:#EAA35C; --s-mandat:#35B27C;
    --good:#2CB86A; --good-ink:#3ECB7B; --warn:#E0A23A; --critical:#E8706B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --brand:#94ABC6; --brand-2:#7C97B5; --brand-ink:#0F1A26; --brand-soft:#1B2836;
    --page:#0E141B; --surface:#172230; --surface-2:#1E2C3B;
    --text-primary:#EAF1F8; --text-secondary:#A7B6C4; --muted:#6E7F90;
    --grid:#223141; --baseline:#324556; --border:rgba(255,255,255,.09);
    --s-ce:#6FA0CE; --s-r2:#EAA35C; --s-mandat:#35B27C;
    --good:#2CB86A; --good-ink:#3ECB7B; --warn:#E0A23A; --critical:#E8706B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--page);color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}

  /* ---------- App bar (marque VPA) ---------- */
  .appbar{position:sticky;top:0;z-index:25;background:linear-gradient(120deg,var(--brand-ink),var(--brand-2));
    color:#fff;box-shadow:0 2px 14px rgba(42,59,78,.22)}
  .appbar-inner{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo-img{height:40px;width:auto;flex:none;display:block}
  .brand-title{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{color:rgba(255,255,255,.72);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .demo-badge{font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 10px;display:none;white-space:nowrap}
  .icon-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:16px;cursor:pointer;
    color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.20);
    border-radius:11px;transition:background .15s,transform .1s}
  .icon-btn:hover{background:rgba(255,255,255,.24)} .icon-btn:active{transform:scale(.94)}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 64px}

  /* ---------- Filtres ---------- */
  .controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  select{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:11px 13px;cursor:pointer;flex:1;min-width:150px;
    box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent)}

  /* ---------- Cartes ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .grid-act{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .grid-fin{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}

  .tile{position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--brand));opacity:.9}
  #tileCE::before{background:var(--s-ce)} #tileR2::before{background:var(--s-r2)} #tileMandat::before{background:var(--s-mandat)}
  #tileTaux::before{background:var(--brand)} #tileCA::before{background:var(--good)} #tilePot::before{background:var(--brand)} #tileRemb::before{background:var(--critical)}
  .tile .label{font-size:12.5px;color:var(--text-secondary);font-weight:650;letter-spacing:.01em}
  .tile .label .chip{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}
  .jsm{display:flex;margin-top:14px}
  .jsm div{flex:1;text-align:center;border-right:1px solid var(--border)}
  .jsm div:last-child{border-right:0}
  .jsm .n{font-size:24px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .jsm .k{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .jsm .big .n{color:var(--brand-2)}
  .tile.single .value{font-size:31px;font-weight:760;margin-top:10px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tile.single .foot{font-size:12.5px;color:var(--muted);margin-top:4px}
  .accent-good .value{color:var(--good-ink)} .accent-crit .value{color:var(--critical)}
  .tile.clickable{cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .15s}
  .tile.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--s-ce) 40%,var(--border))}
  .tile .look{position:absolute;top:14px;right:16px;font-size:11.5px;font-weight:600;color:var(--brand-2);opacity:.85}
  .tile.clickable .label{padding-right:50px}
  .icon-btn svg{display:block}

  .card h2{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .card .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  svg text{font-family:system-ui,sans-serif}

  /* ---------- Segmented (jour/semaine/mois) ---------- */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
  .seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--text-secondary);
    padding:7px 13px;border-radius:8px;cursor:pointer;transition:color .15s;font-weight:600}
  .seg button.on{background:var(--surface);color:var(--brand-2);box-shadow:0 1px 4px rgba(42,59,78,.14)}

  .status{text-align:center;padding:64px 20px;color:var(--text-secondary)}
  .err{color:var(--critical)}
  .footnote{font-size:12px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.6}

  /* ---------- Modal détail ---------- */
  .modal-ov{position:fixed;inset:0;background:rgba(15,26,38,.55);backdrop-filter:blur(3px);display:none;
    align-items:flex-start;justify-content:center;z-index:40;padding:40px 16px;overflow:auto}
  .modal-ov.on{display:flex}
  .modal{background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:16px;
    max-width:600px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px}
  .modal h3{margin:0 0 2px;font-size:16px;font-weight:700}
  .modal .msub{color:var(--text-secondary);font-size:13px;margin:0 0 12px}
  .modal table{width:100%;border-collapse:collapse;font-size:13.5px}
  .modal td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
  .modal tr:last-child td{border-bottom:0}
  .modal td.dt{color:var(--text-secondary);white-space:nowrap;width:1%;font-variant-numeric:tabular-nums}
  .modal .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text-secondary);white-space:nowrap}
  .modal .tag.lead{color:var(--s-ce);border-color:color-mix(in srgb,var(--s-ce) 45%,transparent)}
  .modal .tag.deal{color:var(--s-r2);border-color:color-mix(in srgb,var(--s-r2) 45%,transparent)}
  .modal .tag.appr{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .modal .close{float:right;cursor:pointer;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;font-size:20px;color:var(--muted);line-height:1}
  .modal .close:hover{color:var(--text-primary)}
  .modal .empty{color:var(--muted);font-size:13px;padding:14px 0}
  .modal .mbody{max-height:60vh;overflow:auto}

  .tt{position:fixed;pointer-events:none;z-index:35;background:var(--brand-ink);color:#fff;
    font-size:12px;padding:8px 11px;border-radius:9px;opacity:0;transition:opacity .1s;box-shadow:var(--shadow-lg);white-space:nowrap}
  .tt b{font-weight:700}

  /* ---------- Responsive ---------- */
  @media (max-width:920px){ .grid-2{grid-template-columns:1fr} }
  @media (max-width:720px){
    .grid-act{grid-template-columns:repeat(2,1fr)}
    .grid-fin{grid-template-columns:1fr}
    .brand-title{font-size:15px}
  }
  @media (max-width:560px){
    .wrap{padding:14px 13px 56px}
    .appbar-inner{padding:11px 13px;gap:10px}
    .logo-img{height:32px}
    .card{padding:15px;border-radius:14px}
    .controls{gap:8px}
    select{min-width:0;font-size:13.5px;padding:11px 30px 11px 12px}
    .jsm .n{font-size:21px} .tile.single .value{font-size:27px}
    .icon-btn{width:36px;height:36px}
    .modal-ov{padding:0;align-items:flex-end}
    .modal{max-width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
    .modal .mbody{max-height:70vh}
  }
  @media (max-width:380px){ .grid-act{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <img class="logo-img" src="logo.png" alt="VPA — Votre Projet Auto" />
      <div style="min-width:0">
        <div class="brand-title">Statistiques commerciales</div>
        <div class="sub" id="subline">Chargement…</div>
      </div>
    </div>
    <div class="appbar-actions">
      <span class="demo-badge" id="demoBadge">Démo</span>
      <button class="icon-btn" id="refreshBtn" title="Actualiser">↻</button>
      <a class="icon-btn" href="/api/discover" title="Configuration des champs">⚙</a>
      <button class="icon-btn" id="themeBtn" title="Thème clair / sombre" aria-label="Thème">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.4 A6.6 6.6 0 0 1 8 14.6 Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="controls">
    <select id="userSel" title="Commercial"><option value="all">Tous les commerciaux</option></select>
    <select id="pipelineSel" title="Pipeline"><option value="all">Tous les pipelines</option></select>
  </div>

  <div id="content" style="display:none">
    <!-- Activité : CE / R2 / Mandats en jour · semaine · mois + taux -->
    <div class="grid-act">
      <div class="card tile" id="tileCE"></div>
      <div class="card tile" id="tileR2"></div>
      <div class="card tile" id="tileMandat"></div>
      <div class="card tile single" id="tileTaux"></div>
    </div>

    <!-- Finance -->
    <div class="grid-fin">
      <div class="card tile single accent-good" id="tileCA"></div>
      <div class="card tile single" id="tilePot"></div>
      <div class="card tile single accent-crit" id="tileRemb"></div>
    </div>

    <!-- Graphiques -->
    <div class="grid-2">
      <div class="card">
        <div class="chart-head">
          <div><h2>Activité dans le temps</h2><p class="hint">CE, affaires créées (R2) et mandats rentrés.</p></div>
          <div class="seg" id="granSeg">
            <button data-g="day">Jour</button>
            <button data-g="week">Semaine</button>
            <button data-g="month" class="on">Mois</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="dot" style="background:var(--s-ce)"></i>CE</span>
          <span><i class="dot" style="background:var(--s-r2)"></i>Affaires créées</span>
          <span><i class="dot" style="background:var(--s-mandat)"></i>Mandats</span>
        </div>
        <div id="trendChart"></div>
      </div>
      <div class="card">
        <h2>CA vs remboursements</h2>
        <p class="hint">Sur 12 mois — 1 mandat = <span id="mvLabel">500 €</span>.</p>
        <div class="legend">
          <span><i class="dot" style="background:var(--good)"></i>CA gagné</span>
          <span><i class="dot" style="background:var(--critical)"></i>Remboursements</span>
        </div>
        <div id="finChart"></div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Chargement…</div>
  <div class="footnote" id="foot"></div>
</div>
<div class="tt" id="tooltip"></div>

<div class="modal-ov" id="ceModal">
  <div class="modal">
    <button class="close" id="ceClose" title="Fermer">×</button>
    <h3>Détail des CE</h3>
    <p class="msub" id="ceSub"></p>
    <div id="ceBody" class="mbody"></div>
  </div>
</div>

<script src="stats-client.js"></script>
<script>
const $ = (s)=>document.querySelector(s);
const escapeHtml=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { pipeline:'all', user:'all', gran:'month', raw:null, data:null };
const tooltip = $('#tooltip');

const nf = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function money(v){ try{return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0);}catch(_){return nf.format(v||0)+' €';} }
function moneyK(v){ return v>=1000 ? (v/1000).toFixed(v>=10000?0:1).replace('.',',')+' k€' : nf.format(Math.round(v))+' €'; }
const pct=(x)=> x==null?'—':(x*100).toFixed(0)+' %';

function fmtLabel(key,gran){
  if(gran==='month'){const[y,m]=key.split('-');return new Date(Date.UTC(+y,+m-1,1)).toLocaleDateString('fr-FR',{month:'short'}).replace('.','');}
  if(gran==='week'){return 'S'+key.split('-W')[1];}
  const[y,m,d]=key.split('-');return d+'/'+m;
}

function showTip(e,html){tooltip.innerHTML=html;tooltip.style.opacity='1';const pad=13;let x=e.clientX+pad,y=e.clientY+pad;const r=tooltip.getBoundingClientRect();if(x+r.width>innerWidth)x=e.clientX-r.width-pad;if(y+r.height>innerHeight)y=e.clientY-r.height-pad;tooltip.style.left=x+'px';tooltip.style.top=y+'px';}
const hideTip=()=>tooltip.style.opacity='0';

// ---------- tuiles activité (jour/semaine/mois) ----------
function actTile(el,title,color,vals){
  el.innerHTML=`<div class="label"><i class="chip" style="background:${color}"></i>${title}</div>
    <div class="jsm">
      <div><div class="n">${nf.format(vals.day)}</div><div class="k">Jour</div></div>
      <div><div class="n">${nf.format(vals.week)}</div><div class="k">Semaine</div></div>
      <div class="big"><div class="n">${nf.format(vals.month)}</div><div class="k">Mois</div></div>
    </div>`;
}
function singleTile(el,label,value,foot){
  el.innerHTML=`<div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot||''}</div>`;
}

// ---------- graphique multi-lignes ----------
function lineChart(el,labels,series,gran){
  const W=580,H=250,padL=34,padR=12,padT=14,padB=26,iw=W-padL-padR,ih=H-padT-padB;
  const all=series.flatMap(s=>s.data);
  const max=Math.max(3,...all);
  const n=labels.length;
  const x=(i)=> n<=1?padL+iw/2 : padL+(iw*i)/(n-1);
  const y=(v)=> padT+ih-(v/max)*ih;
  let grid='';
  const ticks=4;
  for(let i=0;i<=ticks;i++){const val=Math.round(max/ticks*i);const yy=y(val);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    grid+=`<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="10" fill="var(--muted)">${val}</text>`;}
  // labels x (sous-échantillonnés)
  let xlab='';const step=Math.ceil(n/8);
  labels.forEach((k,i)=>{ if(i%step===0||i===n-1){ xlab+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtLabel(k,gran)}</text>`; }});
  let paths='';
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    paths+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.data.forEach((v,i)=>{ if(n<=14) paths+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"/>`; });
  });
  // overlay hover
  let hit='';
  labels.forEach((k,i)=>{ const xx=x(i);
    hit+=`<rect x="${xx-iw/n/2}" y="${padT}" width="${Math.max(6,iw/n)}" height="${ih}" fill="transparent" data-i="${i}"/>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${grid}${xlab}
    <line id="cross" x1="0" y1="${padT}" x2="0" y2="${padT+ih}" stroke="var(--baseline)" stroke-width="1" style="opacity:0"/>
    ${paths}${hit}</svg>`;
  const cross=el.querySelector('#cross');
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    r.onmousemove=(e)=>{const i=+r.dataset.i;cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.style.opacity='1';
      const rows=series.map(s=>`<span style="color:${s.color}">●</span> ${s.name} : <b>${nf.format(s.data[i])}</b>`).join('<br>');
      showTip(e,`<b>${fmtLabel(labels[i],gran)}</b><br>${rows}`);};
    r.onmouseleave=()=>{cross.style.opacity='0';hideTip();};
  });
}

// ---------- graphique barres groupées finance ----------
function barChart(el,labels,a,b,colA,colB){
  const W=520,H=250,padL=40,padR=10,padT=14,padB=26,iw=W-padL-padR,ih=H-padT-padB;
  const max=Math.max(1,...a,...b);const n=labels.length;const gw=iw/n;const bw=Math.min(13,gw*0.34);const gap=2.5;
  const y=(v)=>padT+ih-(v/max)*ih;
  let grid='';for(let i=0;i<=4;i++){const val=max/4*i;const yy=y(val);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    grid+=`<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="10" fill="var(--muted)">${moneyK(val)}</text>`;}
  let bars='';labels.forEach((k,i)=>{const cx=padL+gw*i+gw/2;
    const ha=(a[i]/max)*ih,hb=(b[i]/max)*ih;
    bars+=`<g data-tip="${fmtLabel(k,'month')} · CA ${money(a[i])} · Remb. ${money(b[i])}">
      <rect x="${cx-bw-gap/2}" y="${y(a[i])}" width="${bw}" height="${Math.max(0,ha)}" rx="3" fill="${colA}"/>
      <rect x="${cx+gap/2}" y="${y(b[i])}" width="${bw}" height="${Math.max(0,hb)}" rx="3" fill="${colB}"/>
      <rect x="${cx-gw/2}" y="${padT}" width="${gw}" height="${ih}" fill="transparent"/>
      <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtLabel(k,'month')}</text></g>`;});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${grid}${bars}</svg>`;
  el.querySelectorAll('g[data-tip]').forEach(g=>{g.onmousemove=(e)=>showTip(e,g.dataset.tip);g.onmouseleave=hideTip;});
}

// ---------- rendu ----------
function render(d){
  const k=d.kpis;
  actTile($('#tileCE'),'CE — Contacts établis','var(--s-ce)',k.ce);
  const ceTile=$('#tileCE'); ceTile.classList.add('clickable'); ceTile.insertAdjacentHTML('beforeend','<span class="look">détail ›</span>');
  actTile($('#tileR2'),'R2 — Affaires créées','var(--s-r2)',k.r2);
  actTile($('#tileMandat'),'Mandats rentrés','var(--s-mandat)',k.mandats);
  singleTile($('#tileTaux'),'Taux de transformation (mois)',pct(k.tauxTransfo),
    `${nf.format(k.mandats.month)} mandats / ${nf.format(k.ce.month)} CE`);

  singleTile($('#tileCA'),'CA gagné (mois)',money(k.caGagneMonth),`${nf.format(k.wonCountMonth)} affaires facturées × ${money(d.mandatValue)}`);
  singleTile($('#tilePot'),'Potentiel à venir',money(k.potentiel),`${nf.format(k.potentielCount)} mandats en cours`);
  singleTile($('#tileRemb'),'Remboursements (mois)',money(k.remboursementsMonth),`${nf.format(k.remboursementsCount)} affaires remboursées`);

  $('#mvLabel').textContent=money(d.mandatValue);
  lineChart($('#trendChart'),d.trend.labels,[
    {name:'CE',color:getComputedStyle(document.body).getPropertyValue('--s-ce'),data:d.trend.ce},
    {name:'Affaires créées',color:getComputedStyle(document.body).getPropertyValue('--s-r2'),data:d.trend.r2},
    {name:'Mandats',color:getComputedStyle(document.body).getPropertyValue('--s-mandat'),data:d.trend.mandats},
  ],d.gran);
  const cs=getComputedStyle(document.body);
  barChart($('#finChart'),d.finance.labels,d.finance.ca,d.finance.remboursements,cs.getPropertyValue('--good'),cs.getPropertyValue('--critical'));
}

// Recalcule et affiche à partir des données déjà chargées (instantané, sans réseau).
function recompute(){
  const raw=state.raw; if(!raw) return;
  const mapping={...raw.mapping};
  if(state.pipeline!=='all') mapping.pipelines=[Number(state.pipeline)];
  state.mapping=mapping;
  const nowMs=Date.parse(raw.generatedAt)||Date.now();
  const ownerId=state.user==='all'?null:Number(state.user);
  const stats=window.PDStats.computeStats(raw, mapping, {nowMs, gran:state.gran, ownerId});
  state.data={...stats, demo:raw.demo, generatedAt:raw.generatedAt};
  render(state.data);
}

// Charge les données brutes UNE fois, puis remplit les menus.
async function load(){
  $('#status').style.display='block';$('#status').className='status';$('#status').textContent='Chargement des données…';$('#content').style.display='none';
  try{
    const res=await fetch('/api/data');
    const d=await res.json();
    if(d.error) throw new Error(d.message||'Erreur inconnue');
    state.raw=d;
    const sel=$('#pipelineSel');
    if(sel.dataset.filled!=='1'&&d.pipelines&&d.pipelines.length){
      d.pipelines.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});
      sel.dataset.filled='1';sel.value=state.pipeline;
    }
    const usel=$('#userSel');
    if(usel.dataset.filled!=='1'&&d.users&&d.users.length){
      d.users.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.name;usel.appendChild(o);});
      usel.dataset.filled='1';usel.value=state.user;
    }
    $('#demoBadge').style.display=d.demo?'inline-block':'none';
    const when=new Date(d.generatedAt).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});
    $('#subline').textContent=(d.demo?'Aperçu avec données simulées':'Vos données Pipedrive')+' · maj '+when;
    $('#foot').innerHTML=d.demo
      ? (d.reason==='no_token'
          ? "Mode démo : configurez PIPEDRIVE_DOMAIN et PIPEDRIVE_API_TOKEN pour vos données réelles."
          : "Mode démo : le mapping des champs (CE, règlement mandat) n'est pas encore renseigné — voir la page ⚙ Configuration.")
      : '';
    recompute();
    $('#status').style.display='none';$('#content').style.display='block';
  }catch(e){$('#status').className='status err';$('#status').textContent='⚠ '+e.message;$('#content').style.display='none';}
}

function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('pd_theme',t);}catch(_){}}
(function(){const s=localStorage.getItem('pd_theme');if(s)document.documentElement.setAttribute('data-theme',s);})();

// ---------- vue détail CE ----------
function periodLabel(g){return g==='day'?"aujourd'hui":g==='week'?'cette semaine':'ce mois-ci';}
function openCE(){
  if(!state.raw||!state.mapping)return;
  const nowMs=Date.parse(state.raw.generatedAt)||Date.now();
  const ownerId=state.user==='all'?null:Number(state.user);
  const list=window.PDStats.ceDetail(state.raw,state.mapping,{nowMs,ownerId,period:state.gran});
  const uname=state.user==='all'?'tous les commerciaux':(($('#userSel').selectedOptions[0]||{}).textContent||'');
  $('#ceSub').textContent=`${list.length} CE · ${periodLabel(state.gran)} · ${uname}`;
  const body=$('#ceBody');
  if(!list.length){body.innerHTML='<div class="empty">Aucun CE sur cette période avec les filtres actuels.</div>';}
  else{
    body.innerHTML='<table>'+list.map(x=>{
      const d=new Date(x.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
      const src=x.inLead&&x.inDeal?'<span class="tag lead">prospect</span> <span class="tag deal">affaire</span>':x.inLead?'<span class="tag lead">prospect</span>':'<span class="tag deal">affaire</span>';
      const appr=x.stamped?'':' <span class="tag appr" title="Daté à la création (Date CE non renseignée)">approx.</span>';
      return `<tr><td class="dt">${d}</td><td>${escapeHtml(x.title)}</td><td style="text-align:right">${src}${appr}</td></tr>`;
    }).join('')+'</table>';
  }
  $('#ceModal').classList.add('on');
}
$('#tileCE').addEventListener('click',openCE);
$('#ceClose').onclick=()=>$('#ceModal').classList.remove('on');
$('#ceModal').addEventListener('click',(e)=>{if(e.target.id==='ceModal')$('#ceModal').classList.remove('on');});

$('#pipelineSel').onchange=(e)=>{state.pipeline=e.target.value;recompute();};
$('#userSel').onchange=(e)=>{state.user=e.target.value;recompute();};
$('#refreshBtn').onclick=load;
$('#granSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  state.gran=b.dataset.g;$('#granSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));recompute();
});
$('#themeBtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');
  const dark=c==='dark'||(c!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(dark?'light':'dark');if(state.data)render(state.data);};

load();
</script>
</body>
</html>
